name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: ssh through the plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run E2E tests
        run: make test-e2e

  native:
    name: openssh on ${{ matrix.os }} through the plugin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Make sure the OpenSSH client is present on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ssh -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0
          }
          ssh -V

      - name: Run the native OpenSSH E2E tests
        run: go test -tags e2e -count=1 -timeout 10m -v ./test/e2e/native/

  kind:
    name: ssh through operator ${{ matrix.operator }} and traefik on kind
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest operator release the README supports, and the latest.
        operator: ["0.3.0", "0.4.1"]
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Kind
        run: |
          curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Run the Kind E2E tests
        run: make test-e2e-kind-full E2E_OPERATOR_CHART_VERSION=${{ matrix.operator }}

      - name: Keep the cluster logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kind-logs-${{ matrix.operator }}
          path: bin/kind-logs
          if-no-files-found: ignore
