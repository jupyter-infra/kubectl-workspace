name: E2E Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: ssh through the plugin
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run E2E tests
        run: make test-e2e CONTAINER_TOOL=docker
